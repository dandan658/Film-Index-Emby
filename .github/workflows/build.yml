name: Source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer shell syntax
        run: sh -n packaging/film-index.sh
      - name: Check packaging and test Python syntax
        run: python -m py_compile packaging/build-package.py tests/installer-tests.py
      - name: Explain server integration coverage
        run: echo 'Exact Emby runtime checks are recorded under tests/results; this source-only job is not fnOS certification.'
